<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看護サマリー作成アプリ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF生成ライブラリを追加 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #555; margin: 0; padding: 20px; }
        
        /* 帳票スタイル (A4) */
        /* --- FIX START --- */
        .sheet {
            width: 210mm; height: 297mm; background: white; padding: 8mm 10mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); margin: 0 auto; color: black;
            font-size: 10pt; line-height: 1.3; box-sizing: border-box;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* --- FIX END --- */

        /* Excel風テーブル */
        table.excel {
            width: 100%; border-collapse: collapse; border: 2px solid #000;
            font-size: 9.5pt; table-layout: fixed; margin-bottom: 4px;
        }
        table.excel th, table.excel td {
            border: 1px solid #000; padding: 2px 4px; vertical-align: middle;
            word-wrap: break-word;
        }
        /* --- FIX START --- */
        table.excel tr {
            height: 1px; /* 印刷時の各行の最小高さを維持し、不要な縦伸びを防止する */
        }
        /* --- FIX END --- */
        table.excel th { text-align: center; background-color: #f0f0f0; font-weight: normal; }

        /* ユーティリティ */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-xs { font-size: 8pt; }
        .font-bold { font-weight: bold; }
        .text-red { color: #cc0000; }
        .border-none { border: none !important; }
        .border-b { border-bottom: 1px solid #000; }
        .border-r { border-right: 1px solid #000; }
        .border-l { border-left: 1px solid #000; }
        .border-r-0 { border-right: none !important; }
        .border-l-0 { border-left: none !important; }
        .align-top { vertical-align: top !important; }
        .p-0 { padding: 0 !important; }
        .pl-8 { padding-left: 2rem !important; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-200 { background-color: #e5e7eb; }
        .whitespace-nowrap { white-space: nowrap; }
        .overflow-hidden { overflow: hidden; }
        .text-ellipsis { text-overflow: ellipsis; }
        .tracking-tighter { letter-spacing: -0.05em; }
        
        /* チェックボックス表現 */
        .cb { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; margin-right: 2px; position: relative; top: 1px; background: white;}
        .cb.on::after { content: '✔'; position: absolute; top: -6px; left: -1px; font-size: 14px; font-weight: bold; color: black; }

        /* 印刷設定 */
        /* --- FIX START --- */
        @media print {
            body { background: white; padding: 0; margin: 0; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            .sheet { 
                width: 210mm; 
                height: 297mm; 
                box-shadow: none; 
                padding: 10mm 12mm; 
                margin: 0 auto; 
                border: none;
                display: flex;
                flex-direction: column;
            }
            @page { size: A4 portrait; margin: 0; }
        }
        /* --- FIX END --- */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ユーティリティ
        const toWareki = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('ja-JP-u-ca-japanese', { year: 'numeric', month: 'long', day: 'numeric' });
        };

        const calculateAge = (dateStr) => {
            if (!dateStr) return '';
            const birthDate = new Date(dateStr);
            const today = new Date();
            if (isNaN(birthDate.getTime())) return '';
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age.toString();
        };

        const warekiToDateStr = (era, year, month, day) => {
            if (!era || !year || !month || !day) return '';
            let seirekiYear = parseInt(year);
            if (era === '昭和') seirekiYear += 1925;
            else if (era === '平成') seirekiYear += 1988;
            else if (era === '令和') seirekiYear += 2018;
            else if (era === '明治') seirekiYear += 1867;
            else if (era === '大正') seirekiYear += 1911;
            return `${seirekiYear}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        };

        // 初期データ (すべて空にする)
        const initialData = {
            createEra: '令和', createYear: '8', createMonth: '2', createDay: '20',
            facilityName: '社会福祉法人 聖フランシスコ会\n特別養護老人ホーム カサデマドレ',
            staffName: '',
            
            name: '', kana: '', gender: '男',
            birthEra: '昭和', birthYear: '', birthMonth: '', birthDay: '',
            birthDate: '', age: '',
            height: '', weight: '', measureDate: '',
            careLevel: '', careManager: '',
            admissionDate: '', doctor: '',
            address: '', tel: '',

            kp1_name: '', kp1_rel: '', kp1_tel: '',
            kp2_name: '', kp2_rel: '', kp2_tel: '',

            pastIllness: '',
            familyStructure: '', 
            
            infection: '', infectionDetail: '',
            allergy: '', allergyDetail: '',

            bp_sys: '', bp_dia: '', pulse: '', temp: '',
            vaccine_flu: '', vaccine_corona: '', vaccine_corona_count: '',
            
            historyInfo: '',

            move_status: { walk: false, cane: false, car: false, walker: false, wheelchair: false, reclining: false },
            move_note: '', 

            food_level: '', food_main: '', food_side: '', food_toromi: '',
            food_note: '', 

            exc_level: '', exc_tool: { toilet: false, portable: false, rehab_pants: false, diaper: false },
            exc_urine_freq: '', exc_stool_freq: '', exc_last_stool_month: '', exc_last_stool_day: '',
            exc_urine_sense: '', exc_stool_sense: '', exc_laxative: '', exc_laxative_detail: '',
            exc_note: '', 

            bath_level: '', bath_freq: '', bath_method: '', bath_last_month: '', bath_last_day: '',
            bath_note: '', 

            cloth_level: '', cloth_note: '', 

            sleep_status: '', sleep_drug: '', sleep_drug_detail: '',
            sleep_note: '', 

            treatment_detail: '',

            disability: { sight: false, hearing: false, speech: false, cognitive: false, motor: false, other: false },
            communication: '', glasses: '', hearing_aid: '', denture: '', denture_detail: '',
            specialNote: ''
        };

        const eras = ['昭和', '大正', '明治', '平成', '令和'];
        const genders = ['男', '女'];
        const careLevels = ['要支援1','要支援2','要介護1','要介護2','要介護3','要介護4','要介護5'];
        const majorDiseases = ['高血圧症', '脳梗塞', '脳出血', 'アルツハイマー型認知症', 'レビー小体型認知症', '心不全', '誤嚥性肺炎', '糖尿病', '骨粗鬆症'];
        const infectionList = ['ＨＢ抗原', 'ＨＣＶ', 'ＴＰ梅毒', 'ＭＲＳＡ'];
        const stapleFoodOptions = ['米飯', '軟飯', '全粥', 'ミキサー粥', 'ゼリー粥', 'パン', '麺類'];
        const sideDishOptions = ['常菜', '一口大', '粗刻み', '刻み', '極刻み', 'ペースト', 'ソフト食'];
        const toromiOptions = ['なし', '有 (強)', '有 (中間)', '有 (薄い)'];

        // UIコンポーネント (値を直接返すように統一)
        const InputGroup = ({ title, children }) => (
            <div className="bg-gray-800 p-3 rounded mb-4 border border-gray-600">
                <h3 className="text-sm font-bold text-green-400 mb-2 border-b border-gray-600 pb-1">{title}</h3>
                {children}
            </div>
        );
        const Label = ({ children }) => <label className="block text-xs text-gray-400 mb-1">{children}</label>;
        const Input = ({ value, onChange, placeholder, type="text", className="", ...props }) => (
            <input 
                type={type} 
                value={value || ''} 
                onChange={e => onChange(e.target.value)} 
                placeholder={placeholder} 
                className={`bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 focus:outline-none ${className}`} 
                {...props}
            />
        );
        const TextArea = ({ value, onChange, placeholder, rows=2, className="", ...props }) => (
            <textarea 
                value={value || ''} 
                onChange={e => onChange(e.target.value)} 
                placeholder={placeholder} 
                rows={rows} 
                className={`w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 focus:outline-none ${className}`} 
                {...props}
            />
        );
        const Select = ({ value, onChange, options, className="" }) => (
            <select 
                value={value || ''} 
                onChange={e => onChange(e.target.value)} 
                className={`bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 focus:outline-none ${className}`} 
            >
                <option value="">選択</option>
                {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
            </select>
        );
        const CheckBox = ({ label, checked, onChange }) => (
            <label className="flex items-center cursor-pointer mr-3 mb-1">
                <input 
                    type="checkbox" 
                    checked={!!checked} 
                    onChange={e => onChange(e.target.checked)} 
                    className="mr-1" 
                />
                <span className="text-sm text-gray-200">{label}</span>
            </label>
        );
        const RadioGroup = ({ options, value, onChange }) => (
            <div className="flex flex-wrap gap-2">
                {options.map(opt => (
                    <label key={opt} className="flex items-center cursor-pointer">
                        <input 
                            type="radio" 
                            checked={value === opt} 
                            onChange={() => onChange(opt)} 
                            className="mr-1" 
                        />
                        <span className="text-sm text-gray-200">{opt}</span>
                    </label>
                ))}
            </div>
        );

        function App() {
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('summaryDataFinal_v4');
                    return saved ? JSON.parse(saved) : initialData;
                } catch { return initialData; }
            });
            const [historyYear, setHistoryYear] = useState('');

            useEffect(() => { localStorage.setItem('summaryDataFinal_v4', JSON.stringify(data)); }, [data]);

            const up = (key, val) => setData(p => ({ ...p, [key]: val }));
            const upDeep = (pKey, key, val) => setData(p => ({ ...p, [pKey]: { ...p[pKey], [key]: val } }));

            const handleBirthChange = (key, val) => {
                setData(prev => {
                    const next = { ...prev, [key]: val };
                    const dateStr = warekiToDateStr(next.birthEra, next.birthYear, next.birthMonth, next.birthDay);
                    const age = calculateAge(dateStr);
                    return { ...next, birthDate: dateStr, age };
                });
            };

            const addDisease = (disease) => {
                if(!disease) return;
                const entry = historyYear ? `${disease} (${historyYear})` : disease;
                setData(p => ({ ...p, pastIllness: p.pastIllness ? p.pastIllness + '\n' + entry : entry }));
            };

            const getCheckedItems = (obj, labels) => {
                return Object.keys(obj)
                    .filter(key => obj[key])
                    .map(key => labels[key] || key)
                    .join('、');
            };

            const moveLabels = { walk: '独歩', cane: '杖', car: '老人車', walker: '歩行器', wheelchair: '車椅子', reclining: 'リクライニング' };
            const excLabels = { toilet: 'トイレ', portable: 'ポータブル', rehab_pants: 'リハパン', diaper: 'オムツ' };
            const disLabels = { sight: '視覚', hearing: '聴覚', speech: '言語', cognitive: '認知', motor: '運動', other: 'その他' };

            // --- FIX START ---
            // PDFエクスポート処理
            const handleExportPdf = () => {
                const element = document.getElementById('print-area');
                const opt = {
                    margin:       0,
                    filename:     `看護サマリー_${data.name || '新規'}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                // ライブラリを使用してPDF生成
                if (window.html2pdf) {
                    window.html2pdf().set(opt).from(element).save();
                } else {
                    console.error('html2pdf library is not loaded');
                }
            };

            // データ保存（JSONファイル書き出し）
            const handleSaveFile = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `看護サマリー_${data.name || 'データ'}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // データ読み込み（JSONファイル読み込み）
            const handleLoadFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setData(json);
                    } catch (err) {
                        console.error('Failed to load JSON:', err);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // 連続読み込みを可能にするためリセット
            };
            // --- FIX END ---

            return (
                <div className="flex flex-col md:flex-row min-h-screen">
                    {/* 左側：入力フォーム */}
                    <div className="w-full md:w-1/3 bg-gray-900 text-white p-4 overflow-y-auto h-screen no-print box-border">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-green-400">詳細サマリー入力</h2>
                            <div className="flex gap-2">
                                <button onClick={() => {if(window.confirm('全ての入力を消去しますか？')){setData(initialData)}}} className="bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-500">クリア</button>
                                
                                <button onClick={handleSaveFile} className="bg-blue-600 px-3 py-1 rounded text-sm hover:bg-blue-500">保存</button>
                                <button onClick={() => document.getElementById('file-input').click()} className="bg-gray-600 px-3 py-1 rounded text-sm hover:bg-gray-500">読込</button>
                                <input id="file-input" type="file" accept=".json" onChange={handleLoadFile} className="hidden" />

                                <button onClick={handleExportPdf} className="bg-orange-600 px-3 py-1 rounded text-sm font-bold hover:bg-orange-500 text-white shadow">PDF保存</button>
                            </div>
                        </div>

                        <InputGroup title="1. 基本情報">
                        <Label>作成日</Label>
                            <div className="relative bg-gray-700 rounded border border-gray-600">
                                        <input type="date" value={data.admissionDate} onChange={e=>up('admissionDate',e.target.value)} className="w-full bg-transparent text-white px-2 py-1 outline-none cursor-pointer" style={{colorScheme:"dark"}}/>
                                        <span className="absolute right-2 top-1 pointer-events-none">📅</span>
                                    </div>
                            <div className="grid grid-cols-2 gap-2 mb-2">
                                <div><Label>フリガナ</Label><Input value={data.kana} onChange={v=>up('kana',v)} /></div>
                                <div><Label>氏名</Label><Input value={data.name} onChange={v=>up('name',v)} /></div>
                            </div>
                            
                            <div className="mb-2">
                                <Label>性別</Label>
                                <Select value={data.gender} onChange={v=>up('gender',v)} options={genders} className="w-1/2"/>
                            </div>
                            
                            <Label>生年月日 (和暦入力) + 年齢</Label>
                            <div className="flex gap-1 mb-4 items-center">
                                <Select value={data.birthEra} onChange={v=>handleBirthChange('birthEra',v)} options={eras} className="w-20"/>
                                <Input value={data.birthYear} onChange={v=>handleBirthChange('birthYear',v)} className="w-12 text-center" placeholder="年"/>
                                <Input value={data.birthMonth} onChange={v=>handleBirthChange('birthMonth',v)} className="w-10 text-center" placeholder="月"/>
                                <Input value={data.birthDay} onChange={v=>handleBirthChange('birthDay',v)} className="w-10 text-center" placeholder="日"/>
                                <div className="text-yellow-400 font-bold ml-1">{data.age}歳</div>
                            </div>

                            <div className="mb-2 w-full"> <Label>住所</Label> <Input className="w-full" value={data.address} onChange={v => up('address', v)} /></div>
                            <div className="mb-4"><Label>電話番号</Label><Input value={data.tel} onChange={v=>up('tel',v)} /></div>
                            
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                <div>
                                    <Label>入所日 (カレンダー)</Label>
                                    <div className="relative bg-gray-700 rounded border border-gray-600">
                                        <input type="date" value={data.createdDate} onChange={e=>up('createdDate',e.target.value)} className="w-full bg-transparent text-white px-2 py-1 outline-none cursor-pointer" style={{colorScheme:"dark"}}/>
                                        <span className="absolute right-2 top-1 pointer-events-none">📅</span>
                                    </div>
                                </div>
                                <div><Label>主治医</Label><Input value={data.doctor} onChange={v=>up('doctor',v)} /></div>
                            </div>

                            <div className="grid grid-cols-2 gap-2 mb-2">
                                <div><Label>介護度</Label><Select value={data.careLevel} onChange={v=>up('careLevel',v)} options={careLevels} /></div>
                                <div><Label>ケアマネ</Label><Input value={data.careManager} onChange={v=>up('careManager',v)} placeholder="担当ケアマネ"/></div>
                            </div>
                        </InputGroup>

                        <InputGroup title="2. キーパーソン">
                            <div className="grid grid-cols-3 gap-1 mb-2">
                                <div className="col-span-1"><Label>連絡先① 氏名</Label><Input value={data.kp1_name} onChange={v=>up('kp1_name',v)} /></div>
                                <div className="col-span-1"><Label>続柄</Label><Input value={data.kp1_rel} onChange={v=>up('kp1_rel',v)} /></div>
                                <div className="col-span-1"><Label>TEL</Label><Input value={data.kp1_tel} onChange={v=>up('kp1_tel',v)} /></div>
                            </div>
                            <div className="grid grid-cols-3 gap-1">
                                <div className="col-span-1"><Label>連絡先② 氏名</Label><Input value={data.kp2_name} onChange={v=>up('kp2_name',v)} /></div>
                                <div className="col-span-1"><Label>続柄</Label><Input value={data.kp2_rel} onChange={v=>up('kp2_rel',v)} /></div>
                                <div className="col-span-1"><Label>TEL</Label><Input value={data.kp2_tel} onChange={v=>up('kp2_tel',v)} /></div>
                            </div>
                        </InputGroup>

                        <InputGroup title="3. 医療情報">
                            <Label>既往歴 (年 + 選択)</Label>
                            <div className="flex gap-2 mb-2">
                                <Input value={historyYear} onChange={val => setHistoryYear(val)} placeholder="年(R2)" className="w-1/3"/>
                                <select onChange={e=>{addDisease(e.target.value); e.target.value=''}} className="w-2/3 bg-gray-900 border border-gray-600 rounded text-sm text-white">
                                    <option value="">▼病名選択</option>
                                    {majorDiseases.map(d=><option key={d} value={d}>{d}</option>)}
                                </select>
                            </div>
                            <TextArea value={data.pastIllness} onChange={v=>up('pastIllness',v)} rows="3" />
                            <Label>家族構成</Label>
                            <TextArea value={data.familyStructure} onChange={v=>up('familyStructure',v)} rows="2" placeholder="家族構成" />
                            <div className="grid grid-cols-2 gap-2 mt-2">
                                <div>
                                    <Label>感染症</Label>
                                    <div className="flex gap-2">
                                        <select 
                                            value={data.infection} 
                                            onChange={e => up('infection', e.target.value)}
                                            className="bg-gray-900 border border-gray-600 rounded px-1 text-sm text-white focus:border-blue-500 w-16"
                                        >
                                            <option value="">未</option>
                                            <option value="有">有</option>
                                            <option value="無">無</option>
                                        </select>
                                        <div className="flex-1 flex gap-1">
                                            <select 
                                                className="w-20 bg-gray-900 border border-gray-600 rounded px-1 text-sm text-white focus:border-blue-500"
                                                onChange={e => {
                                                    if(!e.target.value) return;
                                                    const current = data.infectionDetail || '';
                                                    const newVal = current ? current + '、' + e.target.value : e.target.value;
                                                    up('infectionDetail', newVal);
                                                    e.target.value = '';
                                                }}
                                            >
                                                <option value="">▼選択</option>
                                                {infectionList.map(i => <option key={i} value={i}>{i}</option>)}
                                            </select>
                                            <Input value={data.infectionDetail} onChange={v=>up('infectionDetail',v)} placeholder="詳細" className="flex-1"/>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <Label>アレルギー</Label>
                                    <div className="flex gap-2">
                                        <select 
                                            value={data.allergy} 
                                            onChange={e => up('allergy', e.target.value)}
                                            className="bg-gray-900 border border-gray-600 rounded px-1 text-sm text-white focus:border-blue-500"
                                        >
                                            <option value="">未</option>
                                            <option value="有">有</option>
                                            <option value="無">無</option>
                                        </select>
                                        <Input value={data.allergyDetail} onChange={v=>up('allergyDetail',v)} placeholder="詳細" className="flex-1"/>
                                    </div>
                                </div>
                            </div>
                        </InputGroup>

                        <InputGroup title="4. 一般状態・ワクチン">
                             <div className="mb-2">
                                <Label>身体計測</Label>
                                <div className="grid grid-cols-3 gap-2">
                                    <Input value={data.height} onChange={v=>up('height',v)} placeholder="身長cm" />
                                    <Input value={data.weight} onChange={v=>up('weight',v)} placeholder="体重kg" />
                                    <div className="relative bg-gray-700 rounded border border-gray-600">
                                        <input type="date" value={data.measureDate} onChange={e=>up('measureDate',e.target.value)} className="w-full bg-transparent text-white px-1 py-1 outline-none cursor-pointer text-xs" style={{colorScheme:"dark"}}/>
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-4 gap-2 mb-2">
                                <div><Label>血圧(上)</Label><Input value={data.bp_sys} onChange={v=>up('bp_sys',v)}/></div>

                                        <th>睡眠</th>
                                        <td>{data.sleep_status}</td>
                                        <td className="text-xs">
                                            <div>眠剤: {data.sleep_drug === '有' ? `有 (${data.sleep_drug_detail})` : '無'}</div>
                                            <div style={{whiteSpace:'pre-wrap'}}>{data.sleep_note}</div>
                                        </td>
                                    </tr>
                                    
                                    <tr>
                                        <th>障害</th>
                                        <td className="text-xs">{getCheckedItems(data.disability, disLabels)}</td>
                                        <td className="text-xs">意思疎通: {data.communication}</td>
                                    </tr>
                                    
                                    <tr>
                                        <th>身体補助具</th>
                                        <td colSpan="2" className="text-xs p-1">
                                            <span className="mr-4 font">メガネ: {data.glasses}</span>
                                            <span className="mr-4 font">補聴器: {data.hearing_aid}</span>
                                            <span className="font">義歯: {data.denture === '有' ? `有 (${data.denture_detail})` : '無'}</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>処置</th>
                                        <td colSpan="2" className="text-xs" style={{whiteSpace:'pre-wrap'}}>{data.treatment_detail}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <div className="flex border border-black mt-auto no-break-inside">
                                <div className="w-2/3 border-r border-black p-1 min-h-[80px] text-xs">
                                    <strong>特記事項</strong><br/>
                                    <div style={{whiteSpace:'pre-wrap'}}>{data.specialNote}</div>
                                </div>
                                <div className="w-1/3 p-2 text-sm flex flex-col justify-between text-center">
                                    <div className="whitespace-pre-wrap font-bold text-center mb-2">{data.facilityName}</div>
                                    <div className="text-right">
                                        <span className="mr-2 text-xs">サマリー担当者</span>
                                        <span className="border-b border-transparent inline-block w-24 text-center mr-2">{data.staffName}</span>
                                        <span className="border border-black rounded-full w-4 h-4 inline-flex items-center justify-center text-[10px] align-middle">印</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
